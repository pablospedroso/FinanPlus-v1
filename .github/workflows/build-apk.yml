name: Gerar APK F+ Finanças

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          set -e

          echo "=== Estrutura do projeto ==="
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "=== Verificando arquivos Android ==="

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d app
          test -f app/build.gradle || test -f app/build.gradle.kts

          echo "Projeto Android encontrado corretamente."

      - name: Verificar versão do Java
        run: |
          java -version

      - name: Verificar versão do Gradle
        run: |
          gradle --version

      - name: Verificar tarefas do projeto
        shell: bash
        run: |
          set -e
          gradle :app:tasks --no-daemon --stacktrace

      - name: Gerar APK Debug
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK gerado com sucesso:"
          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Fmais-Financas-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
