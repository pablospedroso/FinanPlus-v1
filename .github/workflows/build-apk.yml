name: Gerar APK Finan+ v1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Procurar e extrair projeto Android
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$(find . -type f -iname '*Android*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERRO: não encontrei o arquivo *Android*.zip no repositório."
            find . -maxdepth 3 -type f -print
            exit 1
          fi
          rm -rf android_project
          mkdir -p android_project
          unzip -q "$ZIP" -d android_project

          SETTINGS="$(find android_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado depois da extração."
            find android_project -maxdepth 5 -type f -print
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS")"
          echo "Projeto Android: $ROOT"
          test -d "$ROOT/app"
          test -f "$ROOT/app/build.gradle" || test -f "$ROOT/app/build.gradle.kts"
          echo "project_root=$ROOT" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar projeto
        shell: bash
        run: |
          set -euxo pipefail
          cd "$project_root"
          gradle --version
          gradle :app:tasks --no-daemon --stacktrace

      - name: Gerar APK de teste
        shell: bash
        run: |
          set -euxo pipefail
          cd "$project_root"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Gerar AAB para Play Store
        shell: bash
        run: |
          set -euxo pipefail
          cd "$project_root"
          gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Disponibilizar APK e AAB
        uses: actions/upload-artifact@v4
        with:
          name: FinanPlus-v1-APK
          path: |
            ${{ env.project_root }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.project_root }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
