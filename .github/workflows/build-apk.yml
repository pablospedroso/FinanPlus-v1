name: Build Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar e extrair projeto Android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROCURANDO ZIP DO PROJETO"
          echo "=========================================="

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Nenhum arquivo ZIP encontrado na raiz do repositorio."
            ls -la
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP_FILE"

          echo ""
          echo "Extraindo projeto..."

          mkdir -p android_project
          unzip -q "$ZIP_FILE" -d android_project

          echo ""
          echo "Conteudo extraido:"
          find android_project -maxdepth 4 -type f | head -200

      - name: Localizar projeto Gradle
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "LOCALIZANDO PROJETO ANDROID"
          echo "=========================================="

          SETTINGS_FILE=$(find android_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Nao foi encontrado settings.gradle ou settings.gradle.kts dentro do ZIP."
            echo ""
            echo "Estrutura encontrada:"
            find android_project -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "settings encontrado em:"
          echo "$SETTINGS_FILE"

          echo ""
          echo "Diretorio do projeto:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

          echo ""
          echo "Conteudo do projeto:"
          ls -la "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::A pasta app nao foi encontrada dentro do projeto Android."
            exit 1
          fi

          echo ""
          echo "Projeto Android encontrado com sucesso."

      - name: Verificar Gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

          echo ""
          echo "=========================================="
          echo "PROJETO"
          echo "=========================================="

          cd "$PROJECT_DIR"

          echo "Diretorio:"
          pwd

          echo ""
          echo "Arquivos:"
          ls -la

      - name: Verificar tarefas do Gradle
        shell: bash
        run: |
          set -o pipefail

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "TAREFAS DO GRADLE"
          echo "=========================================="

          gradle :app:tasks \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-tasks.log"

      - name: Gerar APK Debug
        shell: bash
        run: |
          set -o pipefail

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "GERANDO APK DEBUG"
          echo "=========================================="

          set +e

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-debug.log"

          EXIT_CODE=${PIPESTATUS[0]}

          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "##########################################"
            echo "CAUSA DO ERRO"
            echo "##########################################"

            echo ""
            echo "===== WHAT WENT WRONG ====="
            grep -n -A 20 -B 3 "What went wrong" "$GITHUB_WORKSPACE/build-debug.log" || true

            echo ""
            echo "===== EXECUTION FAILED ====="
            grep -n -A 15 -B 5 "Execution failed" "$GITHUB_WORKSPACE/build-debug.log" || true

            echo ""
            echo "===== CAUSED BY ====="
            grep -n -A 15 -B 3 "Caused by:" "$GITHUB_WORKSPACE/build-debug.log" || true

            echo ""
            echo "===== ERROR ====="
            grep -n -i -A 10 -B 3 "error:" "$GITHUB_WORKSPACE/build-debug.log" || true

            echo ""
            echo "===== ULTIMAS 100 LINHAS ====="
            tail -n 100 "$GITHUB_WORKSPACE/build-debug.log"

            echo ""
            echo "##########################################"

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "APK DEBUG GERADO COM SUCESSO."

      - name: Verificar APK Debug
        if: success()
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "=========================================="
          echo "VERIFICANDO APK"
          echo "=========================================="

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::app-debug.apk nao foi encontrado."
            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          ls -lh "$APK"

      - name: Gerar APK Release
        if: success()
        shell: bash
        run: |
          set -o pipefail

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "GERANDO APK RELEASE"
          echo "=========================================="

          set +e

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-release.log"

          EXIT_CODE=${PIPESTATUS[0]}

          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "##########################################"
            echo "ERRO NO RELEASE"
            echo "##########################################"

            echo ""
            echo "===== WHAT WENT WRONG ====="
            grep -n -A 20 -B 3 "What went wrong" "$GITHUB_WORKSPACE/build-release.log" || true

            echo ""
            echo "===== CAUSED BY ====="
            grep -n -A 15 -B 3 "Caused by:" "$GITHUB_WORKSPACE/build-release.log" || true

            echo ""
            echo "===== ULTIMAS 100 LINHAS ====="
            tail -n 100 "$GITHUB_WORKSPACE/build-release.log"

            echo ""
            echo "##########################################"

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "APK RELEASE GERADO COM SUCESSO."

      - name: Gerar AAB Release
        if: success()
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "GERANDO AAB PARA GOOGLE PLAY"
          echo "=========================================="

          gradle :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain

          echo ""
          echo "AAB GERADO COM SUCESSO."

      - name: Mostrar arquivos gerados
        if: success()
        shell: bash
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "=========================================="
          echo "ARQUIVOS GERADOS"
          echo "=========================================="

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print \
            -exec ls -lh {} \;

      - name: Disponibilizar APK Debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fmais-financas-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error

      - name: Disponibilizar APK Release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fmais-financas-release
          path: '**/app/build/outputs/apk/release/app-release-unsigned.apk'
          if-no-files-found: error

      - name: Disponibilizar AAB Release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fmais-financas-aab
          path: '**/app/build/outputs/bundle/release/app-release.aab'
          if-no-files-found: error

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-build-gradle
          path: |
            gradle-tasks.log
            build-debug.log
            build-release.log
          if-no-files-found: ignore
