      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          echo "=========================================="
          echo "ESTRUTURA DO PROJETO"
          echo "=========================================="

          echo ""
          echo "Diretório atual:"
          pwd

          echo ""
          echo "Arquivos e pastas principais:"
          find . -maxdepth 3 -type f | sort | head -200

          echo ""
          echo "=========================================="
          echo "VERIFICANDO PROJETO ANDROID"
          echo "=========================================="

          if [ -f "settings.gradle" ]; then
            echo "OK: settings.gradle encontrado."
          elif [ -f "settings.gradle.kts" ]; then
            echo "OK: settings.gradle.kts encontrado."
          else
            echo "::error::settings.gradle ou settings.gradle.kts não encontrado na raiz."
            echo ""
            echo "Conteúdo da raiz:"
            ls -la
            exit 1
          fi

          if [ -d "app" ]; then
            echo "OK: pasta app/ encontrada."
          else
            echo "::error::Pasta app/ não encontrada."
            exit 1
          fi

          echo ""
          echo "Projeto Android encontrado corretamente."
          echo "=========================================="
