name: Gerar APK Finan+ v1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Procurar e extrair projeto Android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android_project staging
          mkdir -p android_project staging

          # Aceita tanto o ZIP atual do repositório quanto outros ZIPs do projeto.
          ZIP="$(find . -type f -iname '*.zip' -not -path './android_project/*' -not -path './staging/*' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo 'ERRO: nenhum arquivo ZIP foi encontrado no repositório.'
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          unzip -q "$ZIP" -d staging

          # Se o ZIP for um pacote que contém outro ZIP, abre o ZIP interno.
          if ! find staging -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | grep -q .; then
            INNER="$(find staging -type f -iname '*.zip' -print -quit || true)"
            if [ -n "$INNER" ]; then
              echo "ZIP interno encontrado: $INNER"
              unzip -q "$INNER" -d android_project
            fi
          else
            cp -a staging/. android_project/
          fi

          SETTINGS="$(find android_project staging -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo 'ERRO: não encontrei settings.gradle no projeto Android.'
            find staging android_project -maxdepth 6 -type f -print
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS")"
          echo "Projeto Android: $ROOT"
          test -d "$ROOT/app"
          test -f "$ROOT/app/build.gradle" || test -f "$ROOT/app/build.gradle.kts"
          echo "project_root=$ROOT" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar projeto
        shell: bash
        run: |
          set -euo pipefail
          cd "$project_root"
          gradle --version
          gradle :app:tasks --no-daemon --stacktrace

      - name: Gerar APK de teste
        shell: bash
        run: |
          set -euo pipefail
          cd "$project_root"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Gerar AAB para Play Store
        shell: bash
        run: |
          set -euo pipefail
          cd "$project_root"
          gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Disponibilizar APK e AAB
        uses: actions/upload-artifact@v4
        with:
          name: FinanPlus-v1-APK
          path: |
            ${{ env.project_root }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.project_root }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
