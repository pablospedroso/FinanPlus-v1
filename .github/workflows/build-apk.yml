name: Build Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          echo "=========================================="
          echo "ESTRUTURA DO PROJETO"
          echo "=========================================="

          echo "Diretorio atual:"
          pwd

          echo ""
          echo "Arquivos encontrados:"
          find . -maxdepth 3 -type f | sort | head -200

          echo ""
          echo "=========================================="
          echo "VERIFICANDO PROJETO ANDROID"
          echo "=========================================="

          if [ -f "settings.gradle" ]; then
            echo "OK: settings.gradle encontrado."
          elif [ -f "settings.gradle.kts" ]; then
            echo "OK: settings.gradle.kts encontrado."
          else
            echo "::error::settings.gradle ou settings.gradle.kts nao encontrado."
            ls -la
            exit 1
          fi

          if [ -d "app" ]; then
            echo "OK: pasta app encontrada."
          else
            echo "::error::Pasta app nao encontrada."
            exit 1
          fi

          echo ""
          echo "Projeto Android encontrado corretamente."

      - name: Verificar Gradle
        shell: bash
        run: |
          echo "=========================================="
          echo "VERSAO DO JAVA"
          echo "=========================================="
          java -version

          echo ""
          echo "=========================================="
          echo "VERSAO DO GRADLE"
          echo "=========================================="
          gradle --version

      - name: Verificar tarefas do Gradle
        shell: bash
        run: |
          set -o pipefail

          gradle :app:tasks \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee gradle-tasks.log

      - name: Gerar APK Debug
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "GERANDO APK DEBUG"
          echo "=========================================="

          set +e

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee build-debug.log

          EXIT_CODE=${PIPESTATUS[0]}

          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "##########################################"
            echo "CAUSA DO ERRO"
            echo "##########################################"

            echo ""
            echo "===== WHAT WENT WRONG ====="
            grep -n -A 20 -B 3 "What went wrong" build-debug.log || true

            echo ""
            echo "===== EXECUTION FAILED ====="
            grep -n -A 15 -B 5 "Execution failed" build-debug.log || true

            echo ""
            echo "===== CAUSED BY ====="
            grep -n -A 15 -B 3 "Caused by:" build-debug.log || true

            echo ""
            echo "===== ERROR ====="
            grep -n -i -A 10 -B 3 "error:" build-debug.log || true

            echo ""
            echo "===== ULTIMAS 100 LINHAS ====="
            tail -n 100 build-debug.log

            echo ""
            echo "##########################################"

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "APK DEBUG GERADO COM SUCESSO."

      - name: Verificar APK
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "VERIFICANDO APK"
          echo "=========================================="

          find app/build/outputs/apk -type f -name "*.apk" -print

          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::app-debug.apk nao foi encontrado."
            exit 1
          fi

          echo "APK encontrado."

      - name: Gerar APK Release
        if: success()
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "GERANDO APK RELEASE"
          echo "=========================================="

          set +e

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee build-release.log

          EXIT_CODE=${PIPESTATUS[0]}

          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "##########################################"
            echo "ERRO NO RELEASE"
            echo "##########################################"

            echo ""
            echo "===== WHAT WENT WRONG ====="
            grep -n -A 20 -B 3 "What went wrong" build-release.log || true

            echo ""
            echo "===== CAUSED BY ====="
            grep -n -A 15 -B 3 "Caused by:" build-release.log || true

            echo ""
            echo "===== ULTIMAS 100 LINHAS ====="
            tail -n 100 build-release.log

            echo ""
            echo "##########################################"

            exit "$EXIT_CODE"
          fi

          echo "APK RELEASE GERADO COM SUCESSO."

      - name: Mostrar arquivos gerados
        if: success()
        run: |
          echo "=========================================="
          echo "ARQUIVOS GERADOS"
          echo "=========================================="

          find app/build/outputs -type f \
            -name "*.apk" -o -name "*.aab" \
            -print

      - name: Disponibilizar APK Debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fmais-financas-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Disponibilizar APK Release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fmais-financas-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-build-gradle
          path: |
            gradle-tasks.log
            build-debug.log
            build-release.log
          if-no-files-found: ignore
